# Loaded via ALSA_CONFIG_PATH. Keep the stock ALSA configuration, then send
# the default device to PulseAudio/PipeWire (the audio-playback/audio-record
# interfaces). Real hardware devices (hw:X) stay available when the manual
# `alsa` interface is connected.
</usr/share/alsa/alsa.conf>

pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA Output (PulseAudio/PipeWire)"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
